name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test via Docker
        run: docker build .

  vcan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t j1939 .
      - name: Load the vcan kernel module
        run: sudo modprobe vcan
      - name: Run SocketCanStream integration tests against vcan0
        run: docker run --rm --cap-add=NET_ADMIN j1939 cmake --build build --target vcan_tests
